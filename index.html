<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
<title>Nepal Flood 2026 — Bhote Koshi &amp; Trishuli</title>
<meta name="description" content="Before/after satellite imagery and Humanitarian OpenStreetMap Team response data for the 26 August 2026 glacier-collapse flood along the Bhote Koshi and Trishuli rivers, Nepal."/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.css"/>
<link rel="stylesheet" href="app/style.css"/>
<script type="module">
  // maplibre-gl 6.x dropped its UMD bundle (dist/maplibre-gl.js) in favour of an
  // ESM-only build (dist/maplibre-gl.mjs); the old plain <script src> tag 404s
  // against unpkg. Import it as a module, expose it as the global `maplibregl`
  // app/app.js expects, then chain-load pmtiles and the app scripts: a module
  // script only runs once the document has finished parsing, so #mapPre,
  // #mapPost etc. already exist by the time this executes.
  import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.mjs';
  window.maplibregl = maplibregl;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  await loadScript('https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js');
  await loadScript('app/config.js');
  await loadScript('app/app.js');
</script>
</head>
<body data-mode="swipe">

<aside id="panel">
  <div class="pad">
    <h1>Nepal Flood 2026 — Bhote Koshi &amp; Trishuli</h1>
    <p class="sub">Glacier-collapse flood of 26 August 2026. Before/after satellite imagery with
      Humanitarian OpenStreetMap Team response data. Drag the divider, or press
      <kbd>[</kbd>&nbsp;<kbd>]</kbd>. <kbd>B</kbd> hides this panel, <kbd>C</kbd> the layer controls.</p>
  </div>
</aside>

<aside id="controls" aria-label="Map layer controls">
  <div class="pad"></div>
</aside>

<button id="sidebarToggle" aria-controls="panel" aria-expanded="true" title="Show or hide the info panel (B)">◂</button>
<button id="controlsToggle" aria-controls="controls" aria-expanded="true" title="Show or hide the layer controls (C)">▸</button>

<div id="stage" aria-label="Before and after satellite comparison">
  <div id="mapPre"></div>
  <div id="mapPost"></div>
  <div id="divider" role="separator" aria-label="Comparison divider" aria-orientation="vertical" tabindex="0">
    <div class="knob">↔</div>
  </div>
  <div class="tagwrap" id="tagPre">
    <button type="button" class="tag" aria-haspopup="true" aria-expanded="false" aria-label="Before imagery and view"></button>
    <div class="tagmenu" role="group" aria-label="Before imagery scenes" hidden></div>
  </div>
  <div class="tagwrap" id="tagPost">
    <button type="button" class="tag" aria-haspopup="true" aria-expanded="false" aria-label="After imagery and view"></button>
    <div class="tagmenu" role="group" aria-label="After imagery scenes" hidden></div>
  </div>
  <div id="readout"></div>
</div>

</body>
</html>
